# 本地完整栈：PostgreSQL 17 + Web + Worker（TASK-001；Gate-01 H10 修复认证配置）
# 前置：cp .env.example .env 并填写 BETTER_AUTH_SECRET（随机 64 hex）；
#       DATABASE_URL 可不填（容器内连接串由下方注入）。
# 启动：docker compose up -d --build
# 地址：Web http://127.0.0.1:3000 ；健康检查 http://127.0.0.1:3000/api/health
# 状态：docker compose ps（worker healthcheck 使用 dist/jobs/status.js）
# 迁移：docker compose exec web pnpm exec prisma migrate deploy
name: ai-ecommerce-assistant

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: aiea
      # M05：本地开发口令可由 .env 覆盖（POSTGRES_PASSWORD）；默认值仅限本机回环开发栈
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiea_local_dev}
      POSTGRES_DB: aiea_dev
    ports:
      # M05：仅绑定回环，避免开发库暴露到可达网络
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiea -d aiea_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    environment:
      DATABASE_URL: postgres://aiea:aiea_local_dev@postgres:5432/aiea_dev
      # TASK-003 起启动必需（instrumentation 校验）；从 .env 注入，缺失即拒绝启动
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required (set it in .env)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: node dist/jobs/worker.js
    environment:
      DATABASE_URL: postgres://aiea:aiea_local_dev@postgres:5432/aiea_dev
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/jobs/status.js"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
