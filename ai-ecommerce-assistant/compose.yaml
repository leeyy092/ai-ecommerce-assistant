# 本地完整栈：PostgreSQL 17 + Web + Worker（TASK-001）
# 使用：cp .env.example .env（compose 路径可不填 DATABASE_URL，下方已注入）
# 启动：docker compose up -d --build
# 地址：Web http://127.0.0.1:3000 ；健康检查 http://127.0.0.1:3000/api/health
# 状态：docker compose ps（worker healthcheck 使用 dist/jobs/status.js）
name: ai-ecommerce-assistant

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: aiea
      POSTGRES_PASSWORD: aiea_local_dev
      POSTGRES_DB: aiea_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiea -d aiea_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    command: pnpm start
    environment:
      DATABASE_URL: postgres://aiea:aiea_local_dev@postgres:5432/aiea_dev
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: node dist/jobs/worker.js
    environment:
      DATABASE_URL: postgres://aiea:aiea_local_dev@postgres:5432/aiea_dev
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/jobs/status.js"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
